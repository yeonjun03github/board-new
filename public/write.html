<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>글 작성</title>
</head>
<body>
<h2>글 작성</h2>
<button onclick="window.location.href='/index.html'">목록으로</button>
<br><br>
<input type="text" id="title" placeholder="제목" style="width:400px"><br><br>
<textarea id="content" rows="10" cols="50" placeholder="내용"></textarea><br><br>
<button onclick="createPost()">작성 완료</button>
<p id="message"></p>

<script>
    async function createPost() {
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login.html';
            return;
        }

        const title = document.getElementById('title').value;
        const content = document.getElementById('content').value;

        const res = await fetch('/posts', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ title, content })
        });

        const data = await res.json();
        if (res.ok) {
            window.location.href = '/index.html';
        } else {
            document.getElementById('message').innerText = data.message;
        }
    }
</script>
</body>
</html>
