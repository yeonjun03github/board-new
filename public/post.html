<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>글 상세</title>
</head>
<body>
<button onclick="window.location.href='/index.html'">목록으로</button>
<button id="edit-btn" onclick="goEdit()" style="display:none">수정</button>
<button id="delete-btn" onclick="deletePost()" style="display:none">삭제</button>

<h2 id="title"></h2>
<p>작성자: <span id="username"></span></p>
<p>작성일: <span id="created-at"></span></p>
<hr>
<p id="content"></p>
<div id="image-container"></div>

<hr>
<h3>댓글</h3>
<div id="comments"></div>

<textarea id="comment-input" placeholder="댓글을 입력하세요" rows="3" cols="50"></textarea>
<br>
<button onclick="submitComment()">댓글 작성</button>

<script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const token = localStorage.getItem('token');
    let myUserId = null;

    if (token) {
        const payload = JSON.parse(atob(token.split('.')[1]));
        myUserId = payload.id;
    }

    async function loadPost() {
        const res = await fetch(`/posts/${id}`);
        const post = await res.json();

        document.getElementById('title').innerText = post.title;
        document.getElementById('username').innerText = post.username;
        document.getElementById('content').innerText = post.content;
        document.getElementById('created-at').innerText = new Date(post.created_at).toLocaleDateString('ko-KR');

        if (post.image) {
            const img = document.createElement('img');
            img.src = post.image;
            img.style.maxWidth = '500px';
            document.getElementById('image-container').appendChild(img);
        }

        if (myUserId && myUserId === post.user_id) {
            document.getElementById('edit-btn').style.display = 'inline';
            document.getElementById('delete-btn').style.display = 'inline';
        }
    }

    async function loadComments() {
        const res = await fetch(`/comments/${id}`);
        const data = await res.json();
        const container = document.getElementById('comments');
        container.innerHTML = '';

        if (!Array.isArray(data)) return;

        data.forEach(comment => {
            const div = document.createElement('div');
            div.innerHTML = `
                <p><strong>${comment.username}</strong>: ${comment.content}</p>
                ${myUserId == comment.user_id ? `<button onclick="removeComment(${comment.id})">삭제</button>` : ''}
                <hr>
            `;
            container.appendChild(div);
        });
    }

    async function submitComment() {
        const content = document.getElementById('comment-input').value;
        if (!content) return alert('댓글을 입력해주세요.');

        const res = await fetch(`/comments/${id}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ content })
        });
        const data = await res.json();
        alert(data.message);
        document.getElementById('comment-input').value = '';
        loadComments();
    }

    async function removeComment(commentId) {
        if (!confirm('댓글을 삭제하시겠습니까?')) return;
        const res = await fetch(`/comments/${commentId}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        alert(data.message);
        loadComments();
    }

    function goEdit() {
        window.location.href = `/edit.html?id=${id}`;
    }

    async function deletePost() {
        if (!confirm('삭제하시겠습니까?')) return;
        const res = await fetch(`/posts/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        alert(data.message);
        window.location.href = '/index.html';
    }

    loadPost();
    loadComments();
</script>
</body>
</html>
